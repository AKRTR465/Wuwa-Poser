name: Offline regression checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Locate the installed MSVC toolchain
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC x64 tools were not found.' }
          'WW_VCVARS64=' + (Join-Path $installation 'VC/Auxiliary/Build/vcvars64.bat') >> $env:GITHUB_ENV
      - name: Run the full offline suite
        shell: pwsh
        run: ./tools/run_offline_checks.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-offline-results
          path: test_outputs/offline/
          if-no-files-found: ignore

  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Pure C++ checks with address and undefined-behavior sanitizers
        shell: bash
        run: |
          mkdir -p build/offline
          for name in unified_transport owned_recovery local_clip camera_diagnostics game_compat_resolution; do
            g++ -std=c++17 -O1 -g -pthread -fsanitize=address,undefined -fno-omit-frame-pointer \
              tools/tests/"$name"_tests.cpp -o "build/offline/$name"
            "build/offline/$name"
          done
      - name: Portable checks against the actual managed sources
        run: |
          dotnet run --project tools/tests/ManagedActorBorrowing/ManagedActorBorrowing.csproj -c Release
          dotnet run --project tools/tests/PortableServiceChecks/PortableServiceChecks.csproj -c Release
      - name: Data certificates and runtime manifests
        shell: pwsh
        run: |
          ./tools/validate_owned_character_catalog.ps1
          ./tools/validate_character_forms.ps1
          ./tools/tests/runtime_manifest_checks.ps1
          ./tools/generate_game_compat.ps1 -Check
          ./tools/generate_playback_control.ps1 -Check
          ./tools/tests/game_compat_generation_checks.ps1
